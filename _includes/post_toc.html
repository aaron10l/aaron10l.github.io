{% unless page.toc == false %}
<nav class="post-toc" aria-label="Table of contents" hidden>
  <p class="post-toc-title">Contents</p>
  <ol class="post-toc-list"></ol>
</nav>
<script type="text/javascript">
  window.initPostToc = function initPostToc() {
    var toc = document.querySelector('.post-toc');
    if (!toc) return;

    var list = toc.querySelector('.post-toc-list');
    var article = document.querySelector('.post-body');
    if (!list || !article) return;

    list.innerHTML = '';
    toc.hidden = true;
    if (window._postTocCleanup) {
      window._postTocCleanup();
      window._postTocCleanup = null;
    }

    var headings = Array.prototype.slice.call(
      article.querySelectorAll('h2, h3')
    );
    if (headings.length < 2) return;

    headings.forEach(function (heading, index) {
      if (!heading.id) heading.id = slugifyHeading(heading.textContent, index);

      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = '#' + heading.id;
      link.textContent = heading.textContent.trim();
      link.className = heading.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
      link.addEventListener('click', function (event) {
        event.preventDefault();
        heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (history.replaceState) {
          history.replaceState(null, '', '#' + heading.id);
        }
      });
      item.appendChild(link);
      list.appendChild(item);
    });

    toc.hidden = false;

    var links = Array.prototype.slice.call(list.querySelectorAll('a'));

    function setActive() {
      var current = headings[0];
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].getBoundingClientRect().top <= 140) {
          current = headings[i];
        }
      }
      links.forEach(function (link) {
        var active = link.hash === '#' + current.id;
        link.classList.toggle('is-active', active);
        if (active) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(function () {
        setActive();
        ticking = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    setActive();

    window._postTocCleanup = function () {
      window.removeEventListener('scroll', onScroll);
    };
  }

  function slugifyHeading(text, index) {
    var slug = text
      .toLowerCase()
      .trim()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-');
    return slug || 'section-' + (index + 1);
  }

  if (!window._postTocBound) {
    window._postTocBound = true;
    document.addEventListener('turbolinks:load', function () {
      if (window.initPostToc) window.initPostToc();
    });
  }
</script>
{% endunless %}
